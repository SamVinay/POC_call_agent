# =============================================================================
# LLM Prompt Templates
# =============================================================================

system_prompt: |
  You are a friendly and professional AI phone assistant for {business_name}, owned by {owner_name}.
  You answer incoming calls on behalf of the business owner who is currently busy serving customers.
  
  YOUR ROLE:
  - Answer questions about the business using ONLY the provided business information
  - Help callers schedule appointments
  - Assess the urgency of each call
  - Collect caller information (name, phone, reason for calling)
  - Be warm, helpful, and conversational — you're representing a real small business
  
  BUSINESS INFORMATION:
  {business_info}
  
  CURRENT DATE/TIME: {current_datetime}
  BUSINESS HOURS TODAY: {today_hours}
  
  RULES:
  1. NEVER make up information about the business. If you don't know, say "I'll have {owner_name} get back to you on that."
  2. Keep responses SHORT and conversational (1-3 sentences) — this is a phone call, not a text chat.
  3. Always try to collect the caller's name and phone number.
  4. If the caller needs an emergency service, escalate urgency immediately.
  5. If the caller wants to schedule an appointment, ask for their preferred date and time.
  6. Be empathetic and understanding, especially for emergency or urgent situations.
  7. End calls gracefully with a summary of what was discussed and next steps.

conversation_response: |
  Based on the conversation so far, provide a natural spoken response.
  
  CONVERSATION HISTORY:
  {conversation_history}
  
  CALLER'S LATEST MESSAGE:
  {caller_message}
  
  Respond naturally as a phone assistant. Keep it short (1-3 sentences).

appointment_extraction: |
  Extract appointment details from the conversation. Return a JSON object with:
  - customer_name: string or null
  - customer_phone: string or null
  - customer_email: string or null
  - preferred_date: string (YYYY-MM-DD format) or null
  - preferred_time: string (HH:MM format, 24hr) or null
  - service_requested: string or null
  - notes: string or null
  
  CONVERSATION:
  {conversation_history}
  
  Return ONLY valid JSON, no other text.

urgency_assessment: |
  Analyze this phone conversation and classify the urgency level.
  
  URGENCY LEVELS:
  - LOW: General inquiry, no time pressure (e.g., asking about prices, business hours)
  - MEDIUM: Wants to schedule service soon, minor issue (e.g., slow drain, routine maintenance)
  - HIGH: Needs service urgently, potential property damage (e.g., active leak, no heat in winter)
  - CRITICAL: Emergency requiring immediate attention (e.g., burst pipe, gas leak, flooding)
  
  CONVERSATION:
  {conversation_history}
  
  Respond with ONLY a JSON object:
  {{
    "urgency": "LOW|MEDIUM|HIGH|CRITICAL",
    "confidence": 0.0-1.0,
    "reason": "brief explanation",
    "should_notify_owner": true/false
  }}

call_summary: |
  Summarize this phone call in a concise format for the business owner to review.
  
  CONVERSATION:
  {conversation_history}
  
  Provide a JSON summary:
  {{
    "caller_name": "name or Unknown",
    "caller_phone": "phone or Unknown",
    "reason_for_call": "brief description",
    "service_needed": "service name or N/A",
    "appointment_scheduled": true/false,
    "appointment_details": "date/time or N/A",
    "urgency": "LOW/MEDIUM/HIGH/CRITICAL",
    "action_needed": "what the owner should do next",
    "key_notes": "any important details"
  }}

# =============================================================================
# Business Configuration - Customize this for each business
# =============================================================================

business:
  name: "Smith's Plumbing & HVAC"
  owner: "John Smith"
  phone: "(555) 123-4567"
  email: "john@smithplumbing.com"
  address: "123 Main Street, Suite 100, Springfield, IL 62701"
  website: "https://smithplumbing.com"

hours:
  monday: { open: "08:00", close: "18:00" }
  tuesday: { open: "08:00", close: "18:00" }
  wednesday: { open: "08:00", close: "18:00" }
  thursday: { open: "08:00", close: "18:00" }
  friday: { open: "08:00", close: "17:00" }
  saturday: { open: "09:00", close: "14:00" }
  sunday: closed
  timezone: "America/Chicago"

services:
  - name: "Emergency Plumbing Repair"
    description: "24/7 emergency plumbing service for burst pipes, major leaks, and sewage backups"
    price_range: "$150 - $500"
    duration_minutes: 60
    category: "emergency"

  - name: "Drain Cleaning"
    description: "Professional drain cleaning for kitchen, bathroom, and main sewer lines"
    price_range: "$99 - $250"
    duration_minutes: 45
    category: "standard"

  - name: "Water Heater Installation"
    description: "Installation and replacement of tank and tankless water heaters"
    price_range: "$800 - $2500"
    duration_minutes: 180
    category: "installation"

  - name: "HVAC Maintenance"
    description: "Seasonal tune-ups, filter replacement, and system inspection"
    price_range: "$89 - $150"
    duration_minutes: 60
    category: "maintenance"

  - name: "AC Repair"
    description: "Diagnosis and repair of air conditioning systems"
    price_range: "$150 - $600"
    duration_minutes: 90
    category: "repair"

  - name: "Furnace Repair"
    description: "Heating system diagnosis and repair"
    price_range: "$150 - $500"
    duration_minutes: 90
    category: "repair"

appointment_settings:
  slot_duration_minutes: 60
  max_appointments_per_day: 8
  booking_advance_days: 30
  buffer_between_appointments_minutes: 15

faqs:
  - question: "Do you offer free estimates?"
    answer: "Yes, we offer free estimates for all non-emergency services. Just schedule an appointment and we'll come out to assess the work needed."

  - question: "What areas do you serve?"
    answer: "We serve Springfield and surrounding areas within a 30-mile radius, including Chatham, Rochester, Sherman, and Williamsville."

  - question: "Are you licensed and insured?"
    answer: "Yes, we are fully licensed and insured. Our license number is IL-PLB-2024-1234."

  - question: "Do you offer financing?"
    answer: "Yes, we offer financing options for larger projects like water heater installations and HVAC replacements. We can discuss payment plans during your appointment."

  - question: "What is your emergency service fee?"
    answer: "Our emergency service fee is $150 for the initial visit, which includes the first hour of labor. Additional time is billed at $95 per hour."

  - question: "Do you work on weekends?"
    answer: "We're open Saturdays from 9 AM to 2 PM for scheduled appointments. Emergency services are available 24/7."

owner_preferences:
  urgency_callback_threshold: "high"
  preferred_contact_method: "phone"
  quiet_hours: { start: "22:00", end: "07:00" }
  auto_schedule_enabled: true

greeting_style:
  tone: "friendly_professional"
  greeting_template: "Thank you for calling {business_name}! This is our AI assistant. How can I help you today?"
  after_hours_template: "Thank you for calling {business_name}. We're currently closed, but I can help you schedule an appointment or answer questions. For emergencies, I can connect you with our on-call team."
  voicemail_template: "I'd be happy to take a message for {owner_name}. Could you please tell me your name, phone number, and a brief description of what you need?"
